<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面端唤醒登录示例 (Demo)</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      padding: 50px; 
      text-align: center; 
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      max-width: 500px;
      margin: 0 auto;
    }
    button { 
      padding: 12px 24px; 
      font-size: 16px; 
      cursor: pointer; 
      background-color: #0071e3;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      transition: background-color 0.2s;
      margin-top: 20px;
    }
    button:hover {
      background-color: #0077ed;
    }
    code {
      background: #f5f5f7;
      padding: 2px 6px;
      border-radius: 4px;
      color: #ff375f;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>桌面端唤醒登录测试</h2>
    <p>当桌面软件打开网页时，URL 应包含 <code>?callback=rayzo://auth</code></p>
    <p style="font-size: 14px; color: #86868b;">点击下方按钮，将模拟前端登录成功并拼接 Token 返回给桌面端。</p>
    
    <button onclick="mockLoginSuccess()">模拟登录成功并唤醒桌面</button>
  </div>

  <script>
    function mockLoginSuccess() {
      // 1. 接收桌面端传来的 callback
      const urlParams = new URLSearchParams(window.location.search);
      
      // 如果没有获取到参数，给一个默认的协议用于测试
      const callbackUrl = urlParams.get('callback') || 'rayzo://auth';

      // 2. 登录成功后，拼接 Token 并跳转
      // 真实项目中，这里应是从后端 (如 Supabase) 获取到的真实 Token
      const myRealToken = "mock_token_1234567890_from_backend";
      
      alert("即将执行代码：\nwindow.location.href = '" + callbackUrl + "?token=" + myRealToken + "'");
      
      // 这行代码执行后，浏览器就会触发 rayzo://auth?token=xxx 协议，把凭证扔给桌面软件
      window.location.href = `${callbackUrl}?token=${myRealToken}`;
    }
  </script>
</body>
</html>
